<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivitätenliste</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>Zugangscode</h2>

    <input
  type="password"
  id="passwordInput"
  placeholder="Code eingeben"
  oninput="checkPassword()"
>

    <p id="loginError"></p>
  </div>
</div>

<div id="appContent" style="display: none;">
<header>
  <h1>Aktivitätenliste</h1>

  <div class="header-buttons">
  <button
  class="secondary-btn"
  onclick="openCategoryModal()"
>
  Kategorien
</button>
    <button onclick="openModal()">Neuer Eintrag</button>
  </div>
</header>

<section class="filters">

  <details class="filter-dropdown">
    <summary>Kategorie</summary>

    <div id="categoryFilterContent"></div>
  </details>

  <details class="filter-dropdown">
    <summary>Wetter</summary>

    <label><input type="checkbox" name="filterWeather" value="Wetter egal" onchange="renderTable()"> Wetter egal</label>

    <label><input type="checkbox" name="filterWeather" value="Gutes Wetter" onchange="renderTable()"> Gutes Wetter</label>

    <label><input type="checkbox" name="filterWeather" value="Schlechtes Wetter" onchange="renderTable()"> Schlechtes Wetter</label>
  </details>

  <details class="filter-dropdown">
    <summary>Person</summary>

    <label><input type="checkbox" name="filterAuthor" value="Charleen" onchange="renderTable()"> Charleen</label>

    <label><input type="checkbox" name="filterAuthor" value="Christine" onchange="renderTable()"> Christine</label>

    <label><input type="checkbox" name="filterAuthor" value="Sarah" onchange="renderTable()"> Sarah</label>
  </details>

  <button onclick="resetFilters()">
    Filter zurücksetzen
  </button>

</section>

 <div class="table-wrapper">
  <table></div>
    <thead>
      <tr>
        <th>Kategorie</th>
        <th>Inhalt</th>
        <th>Adresse</th>
        <th>Wetter</th>
        <th>Von</th>
        <th>Datum</th>
        <th>Aktion</th>
      </tr>
    </thead>
    <tbody id="activityTableBody"></tbody>
  </table>

  <div id="modal" class="modal">
    <div class="modal-content">

      <h2>Neuer Eintrag</h2>

      <select id="category">
        <option value="">Kategorie wählen</option>
        <option>Essen & Trinken</option>
        <option>Veranstaltung</option>
        <option>Ausflug</option>
        <option>Wellness</option>
        <option>Sport</option>
        <option>Shopping</option>
        <option>Sonstiges</option>
      </select>

      <textarea id="content" placeholder="Beschreibung / Idee"></textarea>

      <input type="text" id="address" placeholder="Adresse (optional)">

      <select id="weather">
        <option>Wetter egal</option>
        <option>Gutes Wetter</option>
        <option>Schlechtes Wetter</option>
      </select>

      <select id="author">
        <option value="">Wer hat es eingetragen?</option>
        <option>Charleen</option>
        <option>Christine</option>
        <option>Sarah</option>
      </select>

      <div class="modal-buttons">
        <button onclick="saveActivity()">Speichern</button>
        <button class="cancel-btn" onclick="closeModal()">Abbrechen</button>
      </div>

    </div>
  </div>
<div id="categoryModal" class="modal">
  <div class="modal-content">

    <h2>Kategorien pflegen</h2>

    <div class="category-input-row">
      <input
        type="text"
        id="newCategoryName"
        placeholder="Neue Kategorie"
      >

      <button onclick="addCategory()">Hinzufügen</button>
    </div>

    <div id="categoryList" class="category-list"></div>

    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeCategoryModal()">Schließen</button>
    </div>

  </div>
</div>
</div>
